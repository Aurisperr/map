<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>祁煜 0306 · 全球大屏应援潮汐图</title>
<meta name="description" content="《恋与深空》祁煜 2026 生贺应援全球潮汐地图：拖动世界地图，逐一点亮散落在各城商场的大屏应援，查看每一处的时间、地点与屏幕清单。">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="ivory">
<div class="app">

  <canvas id="map" class="map" role="img"
    aria-label="全球应援点位地图。使用下方列表视图可读取全部点位信息。可用方向键平移，加号减号缩放。"></canvas>

  <div class="map-veil" aria-hidden="true">
    <div class="map-veil__grain"></div>
    <div class="map-veil__vignette"></div>
  </div>

  <!-- ===== 顶栏 ===== -->
  <header class="topbar glass">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 2.4c2.9 3.5 5.2 6.2 5.2 9.4A5.2 5.2 0 0 1 12 17a5.2 5.2 0 0 1-5.2-5.2C6.8 8.6 9.1 5.9 12 2.4Z"
                stroke="#7CF7FF" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M12 21.6c2 0 3.6-1.2 3.6-2.8 0-1.7-1.6-2.4-2.2-4.2-.4-1.2-.2-2.1-.4-2.1s-1 .6-1.2 1.4c-.2.9-.7 1.3-1.1 1.9-.5.8-.7 1.5-.7 2.3 0 1.6 1.4 2.5 2 3.5"
                stroke="#FF6B2C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand__text">
        <h1>祁煜 <em>0306</em></h1>
        <p>Global Support Tide Map</p>
      </div>
    </div>

    <div class="topbar__rule" aria-hidden="true"></div>
    <div class="stats" id="stats"></div>

    <div class="topbar__actions">
      <button class="iconbtn" id="btnWorld" title="全球视图" aria-label="切换到全球视图">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.6 5.3 3.6 8.5S14.4 18.1 12 20.5c-2.4-2.4-3.6-5.3-3.6-8.5S9.6 5.9 12 3.5Z"/></svg>
      </button>
      <button class="iconbtn" id="btnChina" title="聚焦中国" aria-label="聚焦中国区域">
        <svg viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>
      </button>
      <button class="iconbtn" id="btnZoomIn" title="放大" aria-label="放大地图">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6M11 8.6v4.8M8.6 11h4.8"/></svg>
      </button>
      <button class="iconbtn" id="btnZoomOut" title="缩小" aria-label="缩小地图">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6M8.6 11h4.8"/></svg>
      </button>
      <button class="iconbtn" id="btnList" title="列表视图" aria-label="切换列表视图" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg>
      </button>
      <button class="iconbtn" id="btnTheme" title="切换配色版本" aria-label="切换配色版本" aria-pressed="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path class="half" d="M12 3.8a8.2 8.2 0 0 1 0 16.4z"/></svg>
      </button>
      <button class="iconbtn" id="btnSettings" title="显示与动效设置" aria-label="显示与动效设置" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== 筛选 HUD ===== -->
  <aside class="hud glass" aria-label="点位筛选">
    <label class="hud__search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="search" type="search" placeholder="搜索城市或商场" aria-label="搜索城市或商场" autocomplete="off">
    </label>

    <div class="hud__group">
      <span class="hud__legend">应援形式</span>
      <div class="chips" id="chipsKind"></div>
    </div>

    <div class="hud__group">
      <span class="hud__legend">投放状态</span>
      <div class="chips" id="chipsStatus"></div>
    </div>

    <div class="hud__group">
      <span class="hud__legend">我的点亮</span>
      <div class="progress">
        <div class="progress__row">
          <span class="progress__val" id="progressVal"><em>0</em> / 0</span>
          <span class="progress__label">已点亮</span>
        </div>
        <div class="progress__bar"><div class="progress__fill" id="progressFill"></div></div>
        <button class="hud__reset" id="btnReset">清空记录</button>
      </div>
    </div>
  </aside>

  <!-- ===== 详情面板 ===== -->
  <section class="panel glass" id="panel" aria-hidden="true" aria-label="点位详情">
    <button class="panel__close" id="panelClose" aria-label="关闭详情">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="panel__scroll" id="panelBody"></div>
  </section>

  <!-- ===== 设置 ===== -->
  <div class="settings glass" id="settings">
    <h3>显示与动效</h3>
    <div class="set-row">
      <div class="set-row__top">
        <span class="set-row__name">配色版本</span>
        <span class="set-row__val" id="themeVal">主粉副白</span>
      </div>
      <div class="seg" id="themeSeg" role="group" aria-label="配色版本">
        <button class="seg__btn" data-theme="neon" aria-pressed="false">霓虹紫夜</button>
        <button class="seg__btn" data-theme="ivory" aria-pressed="true">主粉副白</button>
      </div>
      <p class="set-row__hint" id="themeHint">樱白磨砂玻璃为结构层，粉色是唯一强调色，紫蓝退为语义辅助。</p>
    </div>
    <div class="set-row">
      <div class="set-row__top">
        <span class="set-row__name">液态玻璃透明度</span>
        <span class="set-row__val" id="glassVal">标准</span>
      </div>
      <input type="range" id="glassRange" min="0" max="92" value="44" aria-label="液态玻璃透明度">
      <p class="set-row__hint">向左更通透、更有折射感，向右更厚实、文字更易读。</p>
    </div>
    <div class="set-row">
      <button class="toggle" id="toggleMotion" aria-pressed="false">
        <span class="set-row__name">降低动效</span>
        <span class="toggle__switch" aria-hidden="true"></span>
      </button>
      <p class="set-row__hint">关闭光斑流动、声纳环与惯性拖拽。</p>
    </div>
    <div class="set-row">
      <button class="toggle" id="toggleContrast" aria-pressed="false">
        <span class="set-row__name">提高文字对比度</span>
        <span class="toggle__switch" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <!-- ===== 列表视图 ===== -->
  <div class="listview" id="listview" aria-label="全部点位列表"></div>

  <!-- ===== 时间轴 ===== -->
  <footer class="timeline glass" aria-label="投放时间轴">
    <div class="tl-read">
      <span class="tl-read__label">潮位 / Tide</span>
      <span class="tl-read__date" id="tlDate">2026.03.06</span>
      <span class="tl-read__sub" id="tlSub"></span>
    </div>
    <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="拖动查看不同日期的投放状态" aria-valuemin="2025-01-01" aria-valuemax="2026-12-31" aria-valuenow="2026-03-06">
      <div class="scrub__track"><div class="scrub__fill" id="scrubFill"></div></div>
      <div class="scrub__ticks" id="scrubTicks"></div>
      <div class="scrub__handle" id="scrubHandle"></div>
    </div>
    <div class="tl-jumps" id="jumps"></div>
  </footer>

  <div class="hint" id="hint">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-1.5V4.5a1.5 1.5 0 0 1 3 0V12m0-1.5v-3a1.5 1.5 0 0 1 3 0V15a5.5 5.5 0 0 1-5.5 5.5H10a5 5 0 0 1-4.3-2.4L3.4 14.6a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg>
    <span>拖动地图寻找你所在的城市 · 点击光点查看时间与地点 · 拖动底部潮汐尺切换日期</span>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
